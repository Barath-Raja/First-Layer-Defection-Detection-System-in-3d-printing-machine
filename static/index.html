<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRST LAYER DETECTION SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            background: #0d0d0d;
            color: #00ff88;
            height: 100vh;
            overflow: hidden;
        }
        
        .dashboard {
            height: 100vh;
            display: grid;
            grid-template:
                "header header header" auto
                "camera alert status" min-content
                "camera chart chart" 1fr
                "logs logs logs" 200px
                / 1fr 280px 220px;
            gap: 15px;
            padding: 20px;
            overflow-y: hidden;
        }
        
        .header {
            grid-area: header;
            display: flex;
            flex-wrap: wrap; /* allow wrapping on small screens */
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 20, 20, 0.8);
            padding: 15px 30px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            border-radius: 10px;
        }
        
        .title {
            font-size: 2.2em;
            font-weight: 700;
            text-shadow: 0 0 20px #00ff88;
            letter-spacing: 4px;
        }

        .header-controls {
            display: flex;
            gap: 20px;
        }

        .mode-btn {
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1.1em;
            font-weight: bold;
            background: transparent;
            color: #00ccff;
            border: 2px solid #00ccff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: rgba(0, 204, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
        }
        .mode-btn:hover:not(.active) {
            background: rgba(0, 204, 255, 0.1);
        }
        
        .emergency-alert {
            grid-area: alert;
            background: rgba(50, 0, 0, 0.9);
            border: 3px solid #ff4444;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(255, 68, 68, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        
        .emergency-alert.active { display: flex; animation: shake 0.5s infinite; }
        .emergency-alert h2 { color: #ff4444; font-size: 1.5em; margin-bottom: 10px; text-shadow: 0 0 20px #ff4444; }
        .emergency-alert p { font-size: 1em; line-height: 1.4; }
        
        .status-card {
            grid-area: status;
            background: rgba(0, 20, 20, 0.8);
            border: 2px solid #00ccff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .status-card.excellent .status-value { color: #00ff88; text-shadow: 0 0 25px #00ff88; }
        .status-card.acceptable .status-value { color: #00ccff; text-shadow: 0 0 25px #00ccff; }
        .status-card.warning .status-value { color: #ffaa00; text-shadow: 0 0 25px #ffaa00; }
        .status-card.emergency .status-value { color: #ff4444; text-shadow: 0 0 25px #ff4444; }
        
        .status-label { font-size: 1em; margin-bottom: 10px; color: #00ccff; letter-spacing: 2px; }
        .status-value { font-size: 2.8em; font-weight: 700; text-shadow: 0 0 25px #00ff88; }
        
        .camera-feed {
            grid-area: camera;
            background: #1a1a1a;
            border: 4px solid #00ccff;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.5);
            animation: pulse-blue 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100%;
        }

        #camImg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            border-radius: 15px;
        }
        
        .upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00ccff;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        .upload-overlay.active { display: flex; }

        .upload-overlay input[type="file"] {
            display: none;
        }

        .upload-lbl {
            padding: 15px 30px;
            border: 2px dashed #00ccff;
            background: rgba(0, 204, 255, 0.1);
            color: #00ccff;
            font-size: 1.5em;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
        }
        .upload-lbl:hover { background: rgba(0, 204, 255, 0.3); }
        
        .chart-panel {
            grid-area: chart;
            background: rgba(0, 20, 20, 0.8);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.4);
            display: flex;
            flex-direction: column;
        }
        
        .chart-title { text-align: center; font-size: 1.1em; margin-bottom: 10px; color: #00ff88; letter-spacing: 2px; }
        .chart-wrapper { position: relative; flex-grow: 1; min-height: 200px; }
        
        .fault-log {
            grid-area: logs;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ff4444;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.3);
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        
        .log-title { font-size: 1.4em; margin-bottom: 20px; color: #ff4444; text-align: center; letter-spacing: 2px; }
        
        .log-entry {
            background: rgba(255, 68, 68, 0.1);
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #ff4444;
            border-radius: 5px;
            font-size: 0.95em;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.3; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 20px rgba(0, 204, 255, 0.5); } 50% { box-shadow: 0 0 40px rgba(0, 204, 255, 0.8); } 100% { box-shadow: 0 0 20px rgba(0, 204, 255, 0.5); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        @media (max-width: 1400px) {
            .dashboard { 
                grid-template: 
                    "header" auto 
                    "camera" 600px
                    "alert" auto
                    "status" auto
                    "chart" 400px
                    "logs" 200px 
                    / 1fr; 
                gap: 15px; 
                overflow-y: auto;
                height: auto;
            }
            .header { justify-content: center; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="title">FIRST LAYER SYSTEM</div>
            <div class="header-controls">
                <button id="btnLive" class="mode-btn active" onclick="setMode('live')">LIVE CAM</button>
                <button id="btnUpload" class="mode-btn" onclick="setMode('upload')">UPLOAD IMAGE</button>
            </div>
        </div>
        
        <div class="camera-feed">
            <img id="camImg" src="/video_feed" onerror="this.style.display='none';">
            
            <div id="uploadOverlay" class="upload-overlay"
                 ondragover="event.preventDefault(); this.style.background='rgba(0, 204, 255, 0.2)';"
                 ondragleave="event.preventDefault(); this.style.background='rgba(0, 0, 0, 0.8)';"
                 ondrop="event.preventDefault(); this.style.background='rgba(0, 0, 0, 0.8)'; handleDrop(event);">
                <label class="upload-lbl">
                    Upload .JPG or .PNG
                    <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">
                </label>
            </div>
        </div>
        
        <div class="emergency-alert" id="emergencyAlert">
            <h2>🚨 EMERGENCY STOP REQUIRED</h2>
            <p>PRINT ERROR DETECTED<br>First layer failure confirmed</p>
        </div>
        
        <div class="status-card" id="statusCard">
            <div class="status-label">Accuracy of Printing</div>
            <div class="status-value" id="accuracyValue">Loading...</div>
        </div>
        
        <div class="chart-panel">
            <div class="chart-title">LIVE ACCURACY CHART</div>
            <div class="chart-wrapper">
                <canvas id="accuracyChart"></canvas>
            </div>
        </div>
        
        <div class="fault-log">
            <div class="log-title">FAULT LOG</div>
            <div id="faultLog"></div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('accuracyChart').getContext('2d');
        const accuracyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Accuracy %',
                    data: [],
                    borderColor: '#00ff88',
                    backgroundColor: 'rgba(0, 255, 136, 0.1)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#00ff88',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0, 255, 136, 0.1)' }, ticks: { color: '#00ccff' } },
                    x: { grid: { color: 'rgba(0, 255, 136, 0.1)' }, ticks: { color: '#00ccff', maxTicksLimit: 10 } }
                },
                plugins: { legend: { labels: { color: '#00ff88' } } }
            }
        });

        let accuracyData = [];
        let chartLabels = [];
        let lastAccuracy = 100;
        let pollInterval;
        let currentMode = 'live';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnLive').classList.toggle('active', mode === 'live');
            document.getElementById('btnUpload').classList.toggle('active', mode === 'upload');
            
            const camImg = document.getElementById('camImg');
            const overlay = document.getElementById('uploadOverlay');

            if (mode === 'live') {
                overlay.classList.remove('active');
                camImg.style.display = 'block';
                camImg.src = "/video_feed";
                if (!pollInterval) pollInterval = setInterval(pollAPI, 1000);
            } else {
                overlay.classList.add('active');
                camImg.style.display = 'none'; // Hide until upload completes
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        function handleDrop(event) {
            if (event.dataTransfer.files && event.dataTransfer.files.length > 0) {
                // Mock standard input event structure
                uploadImage({ target: { files: event.dataTransfer.files } });
            }
        }

        function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const lbl = document.querySelector('.upload-lbl');
            lbl.textContent = "Processing...";

            const formData = new FormData();
            formData.append('image', file);

            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                lbl.innerHTML = `Upload another <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">`;
                
                if (data.error) {
                    alert("Error processing image: " + data.error);
                    return;
                }

                // Display static frame
                const camImg = document.getElementById('camImg');
                camImg.src = "data:image/jpeg;base64," + data.image;
                camImg.style.display = 'block';
                document.getElementById('uploadOverlay').classList.remove('active'); // hide overlay nicely
                
                // Keep overlay button minimal top right
                document.getElementById('uploadOverlay').style.justifyContent = 'flex-start';
                document.getElementById('uploadOverlay').style.alignItems = 'flex-end';
                document.getElementById('uploadOverlay').style.padding = '10px';
                document.getElementById('uploadOverlay').classList.add('active');
                document.querySelector('.upload-lbl').style.fontSize = '1em';
                document.querySelector('.upload-lbl').style.padding = '5px 15px';

                updateDashboard(data);
            })
            .catch(err => {
                lbl.innerHTML = `Upload Failed. Try again <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">`;
                console.error(err);
            });
        }

        function updateDashboard(data) {
            const accuracy = Math.round(data.confidence * 100);
            const accuracyPercent = accuracy + '%';
            const timestamp = new Date().toLocaleTimeString();
            const status = data.status;

            document.getElementById('accuracyValue').textContent = accuracyPercent;

            accuracyData.push(accuracy);
            chartLabels.push(timestamp);
            if (accuracyData.length > 50) { accuracyData.shift(); chartLabels.shift(); }
            
            accuracyChart.data.labels = chartLabels;
            accuracyChart.data.datasets[0].data = accuracyData;
            accuracyChart.update('none');

            const statusCard = document.getElementById('statusCard');
            statusCard.className = 'status-card';
            let logMessage = '';

            if (accuracy >= 90) statusCard.classList.add('excellent');
            else if (accuracy >= 80) statusCard.classList.add('acceptable');
            else if (accuracy >= 70) {
                statusCard.classList.add('warning');
                logMessage = `[${timestamp}] ⚠️ WARNING — ${status} (${accuracyPercent})`;
            } else {
                statusCard.classList.add('emergency');
                showEmergencyAlert(timestamp, status, accuracyPercent);
                logMessage = `[${timestamp}] 🚨 EMERGENCY — ${status} (${accuracyPercent})`;
            }

            if (accuracy < 80 && (accuracy !== lastAccuracy || currentMode === 'upload')) {
                addFaultLog(logMessage);
            }

            lastAccuracy = accuracy;
        }

        function showEmergencyAlert(timestamp, status, acc) {
            const alert = document.getElementById('emergencyAlert');
            alert.querySelector('p').textContent = `${status.toUpperCase()} DETECTED at ${timestamp} (Accuracy: ${acc})`;
            alert.classList.add('active');
            setTimeout(() => alert.classList.remove('active'), 8000);
        }

        function addFaultLog(message) {
            const log = document.getElementById('faultLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            log.insertBefore(entry, log.firstChild);
            if (log.children.length > 20) log.removeChild(log.lastChild);
        }

        function pollAPI() {
            if (currentMode !== 'live') return;
            
            fetch('/api/predict')
                .then(res => res.json())
                .then(data => {
                    if (data.error) return;
                    updateDashboard(data);
                })
                .catch(err => {
                    document.getElementById('accuracyValue').textContent = 'API ERR';
                });
        }

        pollInterval = setInterval(pollAPI, 1000);
        pollAPI();
    </script>
</body>
</html>
